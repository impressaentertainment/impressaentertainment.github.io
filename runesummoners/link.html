<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Rune Summoners - アカウント連携 / Account Link</title>
<style>
html, body { height: 100%; margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; background: #14121c; color: #f1e9d2; display: flex; align-items: center; justify-content: center; text-align: center; }
main { padding: 24px 16px; max-width: 560px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; color: #e8c46a; letter-spacing: 0.04em; }
p { line-height: 1.8; margin: 14px 0 0; }
.sub { color: #a79f8c; font-size: 0.9rem; }
.dot { display: inline-block; width: 10px; height: 10px; margin: 22px 5px 0; border-radius: 50%; background: #e8c46a; animation: b 1.1s infinite ease-in-out; }
.dot:nth-child(2) { animation-delay: 0.18s; } .dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes b { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
<h1>Rune Summoners</h1>
<p id="m">アカウントを連携しています…<br>Linking your account…</p>
<div id="d"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<p class="sub" id="s">このまましばらくお待ちください。<br>Please wait a moment.</p>
<form id="f" method="post" action="https://vv5go7jf2h2gftajukl2b65seu0iogwx.lambda-url.ap-southeast-2.on.aws/gcb" hidden>
<input type="hidden" name="state" id="st"><input type="hidden" name="id_token" id="tk">
</form>
</main>
<script>
(function () {
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var st = h.get('state') || '', tk = h.get('id_token') || '';
  history.replaceState(null, '', location.pathname);
  if (!st || !tk) {
    document.getElementById('m').innerHTML = 'ログインできませんでした。<br>Sign-in failed.';
    document.getElementById('s').innerHTML = 'もう一度ゲームからためしてください。<br>Please try again from the game.';
    document.getElementById('d').hidden = true;
    return;
  }
  document.getElementById('st').value = st;
  document.getElementById('tk').value = tk;
  document.getElementById('f').submit();
})();
</script>
</body>
</html>
